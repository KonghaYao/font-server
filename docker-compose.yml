version: "3"
services:
    minio:
        image: minio/minio:RELEASE.2023-05-04T21-44-30Z
        command: server --console-address ":9001" /data
        restart: always
        expose:
            - 9000
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            - MINIO_ROOT_USER=minioadmin
            - MINIO_ROOT_PASSWORD=minioadmin
        volumes:
            - ./data/minio/data:/data
            - ./data/minio/config:/root/.minio/
